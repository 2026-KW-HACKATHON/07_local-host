
server.port=${PORT:8080}
spring.application.name=bapjul

# MySQL
spring.datasource.url=${BAPJUL_DB_URL:jdbc:mysql://localhost:3306/bapjul?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${BAPJUL_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${BAPJUL_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL
spring.sql.init.mode=embedded
spring.sql.init.encoding=UTF-8

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
