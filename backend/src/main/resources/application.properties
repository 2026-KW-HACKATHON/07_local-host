server.port=${PORT:8080}
spring.application.name=bapjul
spring.datasource.url=${BAPJUL_DB_URL:jdbc:h2:file:./data/bapjul-location}
spring.datasource.username=${BAPJUL_DB_USERNAME:sa}
spring.datasource.password=${BAPJUL_DB_PASSWORD:}
spring.sql.init.mode=embedded
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
